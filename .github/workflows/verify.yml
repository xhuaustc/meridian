name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Restore nginx sidecar cache
        id: nginx-cache
        uses: actions/cache@v4
        with:
          path: |
            .nginx-build
            src-tauri/binaries/nginx-x86_64-unknown-linux-gnu
          key: nginx-${{ runner.os }}-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/prepare-nginx.sh') }}

      - name: Build nginx sidecar
        if: steps.nginx-cache.outputs.cache-hit != 'true'
        run: ./scripts/prepare-nginx.sh x86_64-unknown-linux-gnu

      - name: Verify nginx sidecar
        run: test -x src-tauri/binaries/nginx-x86_64-unknown-linux-gnu

      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
